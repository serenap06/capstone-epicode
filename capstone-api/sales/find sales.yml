info:
  name: find sales
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:9092/api/sales
  body:
    type: json
    data: |-
      {
        "items": [{ "product": "6af35a878568a5d1d062b460", "quantity": 3 }],
        "paymentMethod": "card"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
