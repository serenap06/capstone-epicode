info:
  name: create store
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:9092/api/stores
  body:
    type: json
    data: |-
      {
        "name": "Negozio vuoto",
        "address": "Via Prova 1",
        "city": "Napoli"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
