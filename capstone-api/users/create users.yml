info:
  name: create users
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:9092/api/users/
  body:
    type: json
    data: |-
      {
        "name": "Giovanna",
        "surname": "Rosa",
        "email": "giovanna@demo.it",
        "password": "{{process.env.DEMO_PASSWORD}}",
        "role": "employee",
        "store": "6ae3ccaa12cb9ad980c76dca",
        "weeklyHours": "-5"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
