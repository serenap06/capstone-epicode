info:
  name: find revenue
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:9092/api/reports/revenue?from=2026-11-01&to=2026-11-10&groupBy=day
  params:
    - name: from
      value: 2026-11-01
      type: query
    - name: to
      value: 2026-11-10
      type: query
    - name: groupBy
      value: day
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
